<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유령사냥 — 야행성 유령 테이밍</title>
  <style>
    :root { --ink:#17152b; --muted:#8d91a9; --panel:#ffffff; --line:#e9e9f2; --violet:#7058e8; --violet-dark:#4d3ab9; --mint:#42cfac; --coral:#ff736d; --gold:#ffbf4b; --night:#19172d; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1000px; background:#f4f4fa; color:var(--ink); font-family: Inter, Pretendard, "Noto Sans KR", Arial, sans-serif; }
    button { font:inherit; border:0; cursor:pointer; transition:transform .18s, filter .18s, box-shadow .18s; }
    button:hover { transform:translateY(-2px); filter:brightness(1.03); }
    button:active { transform:translateY(0); }
    .app { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
    aside { background:#1c1933; color:white; padding:28px 18px; position:relative; overflow:hidden; }
    aside:after { content:"✦  ☾  ·  ✦"; position:absolute; bottom:23px; left:19px; font-size:17px; letter-spacing:8px; color:#7665bb; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 10px 32px; font-size:20px; font-weight:850; letter-spacing:-.8px; }
    .brand-mark { display:grid; place-items:center; width:36px; height:36px; color:#19172d; background:#d9cbff; border-radius:13px 13px 15px 15px; font-size:19px; box-shadow:0 0 0 5px rgba(197,177,255,.13); }
    .nav-label { font-size:10px; letter-spacing:1.5px; color:#8983a5; font-weight:bold; padding:0 12px; margin:15px 0 9px; }
    .nav { width:100%; background:transparent; color:#bfbcd2; text-align:left; border-radius:12px; padding:13px 12px; margin:3px 0; font-weight:700; display:flex; align-items:center; gap:12px; }
    .nav .ico { width:23px; text-align:center; font-size:18px; }
    .nav.active { color:white; background:#6d55df; box-shadow:0 9px 20px rgba(59,40,160,.35); }
    .profile { position:absolute; left:18px; right:18px; bottom:67px; border-top:1px solid #373351; padding:17px 10px 0; display:flex; align-items:center; gap:10px; }
    .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#ffb993,#ff786e); display:grid; place-items:center; font-size:16px; }
    .profile b { display:block; font-size:12px; }.profile span{font-size:10px;color:#a6a2bc;}
    main { padding:36px 46px 46px; max-width:1500px; width:100%; margin:auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .eyebrow { font-size:11px; font-weight:850; color:var(--violet); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px; }
    h1 { font-size:31px; line-height:1.15; margin:0; letter-spacing:-1.7px; }.topbar p{margin:7px 0 0;color:var(--muted);font-size:13px;}
    .resources { display:flex; gap:10px; }.resource { background:#fff; min-width:100px; border:1px solid var(--line); padding:10px 13px; border-radius:13px; font-size:12px; font-weight:800; display:flex; gap:7px; align-items:center; }.resource em{font-style:normal;color:#7e7b94;}
    .view { animation:appear .32s ease both; } @keyframes appear {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .hero { min-height:225px; border-radius:22px; position:relative; overflow:hidden; padding:30px 35px; color:white; background:linear-gradient(115deg,#30255e 0%,#51469b 62%,#8b78d9); box-shadow:0 15px 35px rgba(55,43,126,.22); }
    .hero:before{content:"";position:absolute;width:370px;height:370px;right:-20px;top:-180px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7ba 0 7%,#eadb9e 7.5% 9%,#f4d96f 10% 12%,#f6dc75 13% 100%);box-shadow:0 0 65px #fff2a6;opacity:.95}.hero:after{content:"✦  ·  ✦    ⋆   ·   ✦";position:absolute;right:45px;bottom:18px;opacity:.65;font-size:21px;letter-spacing:6px;}
    .hero h2 { font-size:26px; letter-spacing:-1.3px; margin:0 0 8px; position:relative; z-index:1; }.hero p{width:420px;line-height:1.55;font-size:13px;color:#ddd8f6;position:relative;z-index:1;margin:0 0 21px;}.primary{position:relative;z-index:1;background:#ff8e69;color:white;font-weight:800;border-radius:11px;padding:11px 17px;box-shadow:0 8px 15px #33277b55;}.primary span{padding-left:7px;color:#fff0e9;}
    .section-head { display:flex; justify-content:space-between; align-items:end; margin:30px 0 14px; }.section-head h2{margin:0;font-size:19px;letter-spacing:-.8px}.section-head button,.text-button{background:transparent;color:var(--violet);font-size:12px;font-weight:800;padding:4px;}
    .ghost-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }.ghost-card { background:white;border:1px solid var(--line);border-radius:17px;padding:15px; min-height:177px;position:relative;overflow:hidden; }.ghost-card:hover{box-shadow:0 12px 22px #1f19430b;transform:translateY(-3px)}.ghost-card.selected{border:2px solid var(--violet);box-shadow:0 8px 18px #6954dd19;}.ghost-card .tag{font-size:10px;font-weight:850;border-radius:20px;padding:5px 7px;color:#795b15;background:#fff1ca;position:absolute;right:12px;top:12px;}.ghost-card h3{margin:9px 0 3px;font-size:15px;}.ghost-card p{color:var(--muted);font-size:11px;margin:0;}.ghost-card footer{position:absolute;bottom:13px;left:15px;right:15px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800}.xp{height:5px;border-radius:9px;background:#efeff5;overflow:hidden;margin-top:11px}.xp i{display:block;height:100%;border-radius:inherit;background:var(--violet)}
    .ghost { --g:#b990ff; width:74px;height:68px;background:var(--g);border-radius:45px 45px 22px 22px;position:relative;margin:12px auto 0;filter:drop-shadow(0 8px 7px color-mix(in srgb,var(--g),transparent 73%)); animation:float 3s ease-in-out infinite; }.ghost:before{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:17px;background:radial-gradient(circle at 9px 0,transparent 10px,var(--g) 10.5px) 0 0/23px 18px repeat-x;}.ghost .eye{position:absolute;width:9px;height:12px;background:#292544;border-radius:50%;top:28px;z-index:1}.ghost .eye:first-child{left:24px}.ghost .eye:last-child{right:24px}.ghost .mouth{position:absolute;z-index:2;background:#292544;border-radius:0 0 8px 8px;width:12px;height:5px;top:45px;left:31px}.ghost .cheek{position:absolute;width:8px;height:4px;background:#fff5;top:45px;left:14px;border-radius:50%}.ghost .cheek:last-child{left:auto;right:14px}@keyframes float{50%{transform:translateY(-7px) rotate(2deg)}}
    .quick-row { display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:18px; }.quest,.tip{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px 19px;}.quest{display:flex;gap:14px;align-items:center}.quest-icon{display:grid;place-items:center;background:#e9e3ff;border-radius:12px;width:43px;height:43px;font-size:20px}.quest h3,.tip h3{font-size:13px;margin:0 0 4px}.quest p,.tip p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.tip{background:#fffaf1;border-color:#f8edd8}
    .hunt-layout { display:grid; grid-template-columns:1.65fr .8fr; gap:18px; }.hunt-scene { min-height:510px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(#28234b 0%,#42366e 47%,#74649a 48%,#3b345d 49%,#272540 100%);box-shadow:inset 0 0 80px #16132677;color:white; }.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#dcd5ff 1px,transparent 1.5px);background-size:59px 51px,83px 71px;background-position:5px 7px,39px 31px;opacity:.75}.moon{position:absolute;width:150px;height:150px;border-radius:50%;right:58px;top:50px;background:#fff2b3;box-shadow:0 0 45px #fff1ab99}.mountain{position:absolute;bottom:140px;width:100%;height:180px;background:linear-gradient(138deg,transparent 42%,#221e3e 42.5%) 0 20px/320px 190px repeat-x;opacity:.9}.ground{position:absolute;bottom:0;width:100%;height:160px;background:linear-gradient(#282543,#19182c)}.grass{position:absolute;bottom:135px;left:0;right:0;color:#8377a5;font-size:26px;letter-spacing:5px;overflow:hidden;white-space:nowrap}.scene-copy{position:absolute;z-index:3;top:27px;left:30px}.scene-copy h2{font-size:23px;margin:0 0 5px}.scene-copy p{margin:0;color:#d1cce5;font-size:12px}.encounter{position:absolute;z-index:4;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;justify-items:center;text-align:center}.encounter .ghost{width:136px;height:124px;border-radius:72px 72px 37px 37px;margin:0 0 10px}.encounter .ghost:before{left:19px;right:19px;height:27px;background-size:43px 28px}.encounter .ghost .eye{width:16px;height:22px;top:52px}.encounter .ghost .eye:first-child{left:43px}.encounter .ghost .eye:last-child{right:43px}.encounter .ghost .mouth{top:80px;left:56px;width:24px;height:9px}.encounter .ghost .cheek{top:81px;left:25px}.encounter .ghost .cheek:last-child{left:auto;right:25px}.encounter b{font-size:18px}.encounter span{font-size:11px;color:#e4dfff;margin-top:4px}.scene-actions{position:absolute;bottom:24px;left:30px;right:30px;z-index:4;display:flex;gap:10px;justify-content:center}.capture{background:var(--coral);color:white;border-radius:12px;font-weight:850;padding:13px 21px;box-shadow:0 7px 16px #241e4599}.scan{background:#ffffff18;color:white;border:1px solid #ffffff36;border-radius:12px;padding:12px 17px;font-weight:800}.encounter-panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px}.encounter-panel h3{font-size:16px;margin:0 0 6px}.encounter-panel>p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 18px}.stat{margin:13px 0}.stat-head{font-size:11px;display:flex;justify-content:space-between;font-weight:750}.bar{height:7px;background:#efeff5;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{height:100%;display:block;border-radius:inherit}.note{margin-top:18px;padding:13px;border-radius:12px;background:#f6f3ff;color:#574b93;font-size:11px;line-height:1.55}.small-ghost{transform:scale(.67);transform-origin:center;margin:-7px auto -2px}
    .sanctuary { display:grid;grid-template-columns:1.15fr .85fr;gap:18px; }.selected-ghost { min-height:490px;border-radius:22px;padding:26px;position:relative;overflow:hidden;background:linear-gradient(145deg,#e9e2ff,#d7f0ff);}.selected-ghost:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:#fff9;right:-75px;top:-75px}.display-ghost{transform:scale(2.5);position:absolute;left:38%;top:43%;z-index:2}.display-ghost .ghost{animation-duration:2.5s}.selected-info{position:relative;z-index:3}.selected-info h2{font-size:23px;margin:3px 0}.selected-info p{font-size:12px;color:#5f5b78;margin:0}.level-pill{display:inline-block;background:#6653cc;color:white;border-radius:50px;font-size:10px;font-weight:850;padding:6px 9px}.bond{position:absolute;z-index:3;bottom:25px;left:26px;right:26px;background:#fffaf0cc;border:1px solid #fff;border-radius:15px;padding:13px 15px}.bond b{font-size:12px}.bond span{float:right;font-size:11px;color:#c2783d;font-weight:bold}.care-panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:23px}.care-panel h2{font-size:18px;margin:0 0 5px}.care-panel>p{font-size:12px;color:var(--muted);margin:0 0 20px}.care{width:100%;background:#fafaff;border:1px solid #eceaf5;border-radius:13px;padding:13px;margin:7px 0;text-align:left;display:flex;gap:11px;align-items:center}.care strong{font-size:12px;display:block}.care small{font-size:10px;color:var(--muted)}.care-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:#eee9ff;font-size:17px}.care:nth-of-type(3) .care-icon{background:#e6fbf4}.care:nth-of-type(4) .care-icon{background:#fff0dc}.care .cost{margin-left:auto;font-size:10px;font-weight:850;color:#605b79}
    .battle-field{min-height:535px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(#201e3c 0%,#4e4385 64%,#2e294d 65%);color:white}.battle-field:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 76%,#8672d666,transparent 40%),radial-gradient(ellipse at 18% 18%,#fff5bc22,transparent 18%)}.battle-title{position:relative;z-index:2;text-align:center;padding-top:20px;font-size:12px;color:#d7cfff;font-weight:800;letter-spacing:1px}.fighter{position:absolute;z-index:2;text-align:center}.fighter.enemy{right:19%;top:105px}.fighter.player{left:19%;bottom:120px}.fighter .ghost{transform:scale(1.55);margin-bottom:29px}.fighter .ghost.small{transform:scale(1.26)}.fighter b{display:block;font-size:14px}.fighter small{font-size:10px;color:#dbd6ef}.hpbox{width:180px;background:#ffffffde;color:#3a3655;padding:8px 10px;border-radius:11px;text-align:left;box-shadow:0 5px 12px #17152b33}.hpbox b{font-size:11px;display:inline}.hpbox span{float:right;font-size:10px;font-weight:800}.battle-actions{position:absolute;bottom:0;z-index:3;width:100%;padding:14px 18px;background:#19172de8;display:grid;grid-template-columns:1.1fr 1fr;gap:12px}.battle-log{font-size:11px;color:#d4cee8;line-height:1.45;padding:6px}.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px}.move{background:#fff;color:#302c4c;border-radius:9px;text-align:left;padding:9px 10px;font-size:11px;font-weight:800}.move i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8d71ef;margin-right:6px}.move:nth-child(2) i{background:#4fd2ad}.move:nth-child(3) i{background:#ffa059}.move:nth-child(4) i{background:#63a8ed}.battle-side{display:grid;grid-template-rows:auto 1fr;gap:16px}.versus-card,.reward-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.versus-card h3,.reward-card h3{font-size:14px;margin:0 0 7px}.versus-card p,.reward-card p{font-size:11px;line-height:1.55;color:var(--muted);margin:0}.rival{margin-top:15px;border-radius:13px;background:#f7f5ff;padding:12px;display:flex;gap:8px;align-items:center}.rival b{font-size:12px}.rival small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .toast { position:fixed;left:50%;bottom:28px;transform:translate(-50%,15px);background:#25213e;color:white;border-radius:12px;padding:12px 16px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 25px #13102244;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1100px){main{padding:28px}.ghost-grid{grid-template-columns:repeat(2,1fr)}.hero:before{right:-100px}.hunt-layout,.sanctuary{grid-template-columns:1fr}.encounter-panel{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><div class="brand-mark">☾</div>유령사냥</div>
      <div class="nav-label">탐험</div>
      <button class="nav active" data-view="home"><span class="ico">⌂</span> 야영지</button>
      <button class="nav" data-view="hunt"><span class="ico">◌</span> 안개 사냥</button>
      <div class="nav-label">나의 유령</div>
      <button class="nav" data-view="sanctuary"><span class="ico">♧</span> 유령 우리</button>
      <button class="nav" data-view="battle"><span class="ico">⚔</span> 달빛 결투장</button>
      <div class="profile"><div class="avatar">🧑🏽</div><div><b>야간 조사관</b><span>견습 테이머 · Lv. 7</span></div></div>
    </aside>
    <main>
      <div class="topbar"><div><div class="eyebrow" id="eyebrow">MOONLIGHT CAMP</div><h1 id="page-title">좋은 밤이에요, 조사관님.</h1><p id="page-subtitle">새로운 유령의 기척이 안개 숲에서 느껴집니다.</p></div><div class="resources"><div class="resource">✦ <em>루나</em> <span id="luna">260</span></div><div class="resource">◉ <em>봉인구</em> <span id="orbs">5</span></div></div></div>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const ghosts = [
      {id:'miri',name:'미리',kind:'달빛 유령',level:12,color:'#b990ff',tag:'희귀',xp:64,hp:96,atk:22,def:17,desc:'달을 베고 잠드는 몽상가'},
      {id:'pipi',name:'피피',kind:'장난 유령',level:8,color:'#ff9d92',tag:'보통',xp:38,hp:74,atk:15,def:12,desc:'주머니 속 종을 좋아해요'},
      {id:'toto',name:'토토',kind:'이끼 유령',level:10,color:'#68d7b1',tag:'희귀',xp:82,hp:88,atk:16,def:21,desc:'비 온 뒤에 가장 활발해요'},
      {id:'nabi',name:'나비',kind:'별가루 유령',level:6,color:'#70b8ff',tag:'보통',xp:27,hp:62,atk:18,def:9,desc:'밤하늘을 스쳐 지나가요'}
    ];
    let selected = ghosts[0], state = JSON.parse(localStorage.getItem('ghostHuntState')||'{"luna":260,"orbs":5,"wins":0,"caught":0}');
    let encounter = {name:'루루',kind:'안개 유령',color:'#8ce0db',rarity:'희귀',level:9, hp:78,atk:17,def:14,desc:'달빛 안개 속에서 노래해요'};
    let playerHP=100, enemyHP=100, battling=false;
    const $=s=>document.querySelector(s);
    function ghost(color,extra=''){ return `<div class="ghost ${extra}" style="--g:${color}"><i class="eye"></i><i class="eye"></i><i class="mouth"></i><i class="cheek"></i><i class="cheek"></i></div>`; }
    function save(){localStorage.setItem('ghostHuntState',JSON.stringify(state));$('#luna').textContent=state.luna;$('#orbs').textContent=state.orbs;}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
    function card(g){return `<button class="ghost-card ${selected.id===g.id?'selected':''}" data-select="${g.id}" style="text-align:left"><span class="tag">${g.tag}</span>${ghost(g.color)}<h3>${g.name} <small style="color:#8d91a9;font-size:10px">Lv.${g.level}</small></h3><p>${g.kind}</p><div class="xp"><i style="width:${g.xp}%"></i></div><footer><span>친밀도 ${Math.min(99,g.xp+12)}%</span><span style="color:#7058e8">자세히 ›</span></footer></button>`}
    function header(title,sub,eyebrow){$('#page-title').textContent=title;$('#page-subtitle').textContent=sub;$('#eyebrow').textContent=eyebrow;}
    function home(){header('좋은 밤이에요, 조사관님.','새로운 유령의 기척이 안개 숲에서 느껴집니다.','MOONLIGHT CAMP');return `<div class="hero"><h2>오늘 밤, 새로운 친구를<br>만나러 갈까요?</h2><p>안개 사냥에서 길 잃은 유령을 찾아 봉인하고, 우리에서 함께 성장시켜 보세요.</p><button class="primary" data-goto="hunt">안개 숲으로 <span>→</span></button></div><div class="section-head"><h2>내 곁의 유령들 <small style="font-size:12px;color:#9694a7;font-weight:600">${ghosts.length}/18</small></h2><button data-goto="sanctuary">우리 보기 →</button></div><div class="ghost-grid">${ghosts.map(card).join('')}</div><div class="quick-row"><div class="quest"><div class="quest-icon">☾</div><div><h3>오늘의 관찰 일지</h3><p>유령에게 간식을 1번 건네면 루나 30개를 받아요.</p></div><button class="text-button" data-reward="30">받기</button></div><div class="tip"><h3>✦ 조사관의 팁</h3><p>친밀도가 높을수록 결투장에서 강력한 합동 기술을 사용할 수 있어요.</p></div></div>`}
    function hunt(){header('안개 사냥','달빛이 가장 짙은 곳에서 유령을 찾아보세요.','HAUNTING GROUNDS');return `<div class="hunt-layout"><div class="hunt-scene"><div class="stars"></div><div class="moon"></div><div class="mountain"></div><div class="grass">♧ ♧ ♧ ♧ ♧ ♧ ♧ ♧ ♧ ♧ ♧ ♧</div><div class="ground"></div><div class="scene-copy"><h2>속삭이는 숲</h2><p>위험도 ●●○ · 희귀 유령 출현 중</p></div><div class="encounter" id="encounter">${ghost(encounter.color)}<b>${encounter.name}</b><span>${encounter.kind} · Lv.${encounter.level}</span></div><div class="scene-actions"><button class="scan" id="scan">✦ 기척 찾기</button><button class="capture" id="capture">◉ 봉인 시도 <small>×1</small></button></div></div><div class="encounter-panel"><div class="small-ghost">${ghost(encounter.color)}</div><h3 id="enc-name">${encounter.name} <small style="font-weight:600;color:#8d91a9">Lv.${encounter.level}</small></h3><p id="enc-desc">${encounter.desc}</p><div class="stat"><div class="stat-head"><span>발견 난이도</span><span>보통</span></div><div class="bar"><i style="width:48%;background:#ff9a73"></i></div></div><div class="stat"><div class="stat-head"><span>친화 속성</span><span>달빛</span></div><div class="bar"><i style="width:72%;background:#8069e7"></i></div></div><div class="note">💡 <b>봉인 팁</b><br>유령의 기분이 좋은 보름달에는 봉인 성공률이 올라가요.</div></div></div>`}
    function sanctuary(){header('유령 우리','선택한 친구와 교감하고 다음 결투를 준비하세요.','THE SANCTUARY');let g=selected;return `<div class="sanctuary"><div class="selected-ghost"><div class="selected-info"><span class="level-pill">LV. ${g.level}</span><h2>${g.name}</h2><p>${g.kind} · ${g.desc}</p></div><div class="display-ghost">${ghost(g.color)}</div><div class="bond"><b>유대감</b><span>${Math.min(99,g.xp+12)} / 100</span><div class="bar"><i style="width:${Math.min(99,g.xp+12)}%;background:#ff9975"></i></div></div></div><div class="care-panel"><h2>오늘의 돌봄</h2><p>${g.name}에게 무엇을 해줄까요?</p><button class="care" data-care="snack"><span class="care-icon">🍪</span><span><strong>달콤한 달과자</strong><small>친밀도 +8 · 경험치 +12</small></span><span class="cost">루나 15</span></button><button class="care" data-care="train"><span class="care-icon">✦</span><span><strong>부유 훈련</strong><small>공격 +2 · 경험치 +18</small></span><span class="cost">에너지 1</span></button><button class="care" data-care="rest"><span class="care-icon">☾</span><span><strong>별빛 낮잠</strong><small>체력 회복 · 기분 좋아짐</small></span><span class="cost">무료</span></button><div style="margin-top:20px;padding-top:17px;border-top:1px solid #eee"><h3 style="margin:0 0 9px;font-size:12px">성장 정보</h3><div class="stat"><div class="stat-head"><span>HP</span><span>${g.hp}</span></div><div class="bar"><i style="width:${g.hp}%;background:#ff8e78"></i></div></div><div class="stat"><div class="stat-head"><span>공격력</span><span>${g.atk}</span></div><div class="bar"><i style="width:${g.atk*3}%;background:#7158df"></i></div></div></div></div></div><div class="section-head"><h2>동료 바꾸기</h2><button data-goto="home">모두 보기 →</button></div><div class="ghost-grid">${ghosts.map(card).join('')}</div>`}
    function battle(){header('달빛 결투장','승리하면 루나와 경험치를 얻을 수 있어요.','MOONLIGHT DUEL');let g=selected;return `<div class="hunt-layout"><div class="battle-field"><div class="battle-title">ROUND 01 · 달빛 결투</div><div class="fighter enemy"><div class="hpbox"><b>까망이</b><span id="enemy-hp">${enemyHP} / 100</span><div class="bar"><i id="enemy-bar" style="width:${enemyHP}%;background:#ff7b76"></i></div></div>${ghost('#9d9bb4','small')}<small>그림자 유령 · Lv. 10</small></div><div class="fighter player"><div class="hpbox"><b>${g.name}</b><span id="player-hp">${playerHP} / 100</span><div class="bar"><i id="player-bar" style="width:${playerHP}%;background:#54d2ae"></i></div></div>${ghost(g.color)}<small>${g.kind} · Lv. ${g.level}</small></div><div class="battle-actions"><div class="battle-log" id="battle-log">${g.name}의 차례예요.<br>어떤 기술을 사용할까요?</div><div class="moves"><button class="move" data-move="35"><i></i>달빛 꼬리치기</button><button class="move" data-move="28"><i></i>따스한 속삭임</button><button class="move" data-move="46"><i></i>유령불꽃</button><button class="move" data-move="21"><i></i>안개 방패</button></div></div></div><div class="battle-side"><div class="versus-card"><h3>오늘의 상대</h3><p>견습 테이머 유진이 그림자 유령 ‘까망이’와 도전장을 보냈어요.</p><div class="rival"><div class="avatar" style="background:linear-gradient(135deg,#8299ef,#4c55ad)">🧑🏻</div><div><b>테이머 유진</b><small>연승 3회 · 친선전</small></div></div></div><div class="reward-card"><h3>승리 보상</h3><p>✦ 루나 45<br>◌ ${g.name} 경험치 24<br>♧ 친밀도 4</p><button class="primary" style="margin-top:16px;width:100%;padding:10px" data-goto="sanctuary">전투 전 돌봄</button></div></div></div>`}
    function render(view){ let html={home,hunt,sanctuary,battle}[view]();$('#view').innerHTML=html;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));bind(view); }
    function bind(view){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>render(b.dataset.goto));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=ghosts.find(g=>g.id===b.dataset.select);toast(`${selected.name}을(를) 대표 유령으로 선택했어요.`);render(view)});document.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>{state.luna+=+b.dataset.reward;save();toast('루나 30개를 받았어요!');b.disabled=true;b.textContent='완료'});if(view==='hunt'){ $('#scan').onclick=newEncounter; $('#capture').onclick=capture;}if(view==='sanctuary'){document.querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>care(b.dataset.care));}if(view==='battle'){document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(+b.dataset.move));}}
    function newEncounter(){let options=[{name:'루루',kind:'안개 유령',color:'#8ce0db',rarity:'희귀',level:9,desc:'달빛 안개 속에서 노래해요'},{name:'보보',kind:'호박 유령',color:'#ffac63',rarity:'보통',level:7,desc:'호박씨를 모으는 수집가예요'},{name:'세라',kind:'별가루 유령',color:'#eea0df',rarity:'희귀',level:11,desc:'별빛이 꺼지면 나타나요'}];encounter=options[Math.floor(Math.random()*options.length)];render('hunt');toast(`${encounter.name}의 기척을 발견했어요!`)}
    function capture(){if(state.orbs<1){toast('봉인구가 부족해요. 결투 보상으로 얻어보세요!');return}state.orbs--;let success=Math.random()<.72;save();if(success){let id='g'+Date.now();ghosts.push({id,name:encounter.name,kind:encounter.kind,level:encounter.level,color:encounter.color,tag:encounter.rarity,xp:8,hp:70,atk:15,def:11,desc:encounter.desc});state.caught++;save();toast(`✦ 성공! ${encounter.name}이(가) 동료가 되었어요.`);setTimeout(newEncounter,900)}else{toast(`${encounter.name}이(가) 안개 속으로 숨어버렸어요. 다시 시도해봐요!`)}}
    function care(type){if(type==='snack'){if(state.luna<15){toast('루나가 부족해요. 결투장에서 벌어보세요!');return}state.luna-=15;selected.xp=Math.min(100,selected.xp+12);save();toast(`${selected.name}의 친밀도가 올랐어요!`)}else if(type==='train'){selected.xp=Math.min(100,selected.xp+18);selected.atk+=2;toast(`${selected.name}의 공격력이 올랐어요!`)}else{selected.hp=100;toast(`${selected.name}이(가) 기분 좋게 쉬었어요.`)}render('sanctuary')}
    function move(power){if(battling)return;battling=true;let damage=Math.round(power*(.55+Math.random()*.4));enemyHP=Math.max(0,enemyHP-damage);$('#enemy-hp').textContent=`${enemyHP} / 100`;$('#enemy-bar').style.width=enemyHP+'%';$('#battle-log').innerHTML=`${selected.name}의 기술이 명중!<br>까망이에게 <b>${damage}</b>의 피해를 주었어요.`;if(enemyHP===0){state.luna+=45;selected.xp=Math.min(100,selected.xp+24);state.wins++;save();setTimeout(()=>{toast('🏆 승리! 루나 45개와 경험치를 얻었어요.');enemyHP=100;playerHP=100;render('battle')},800);return}setTimeout(()=>{let hit=Math.round(13+Math.random()*14);playerHP=Math.max(0,playerHP-hit);$('#player-hp').textContent=`${playerHP} / 100`;$('#player-bar').style.width=playerHP+'%';$('#battle-log').innerHTML+=`<br>까망이의 반격! ${selected.name}이(가) ${hit}의 피해를 받았어요.`;battling=false;if(playerHP===0){setTimeout(()=>{toast('아쉬워요! 우리에서 돌본 뒤 다시 도전해요.');playerHP=100;enemyHP=100;render('battle')},700)}},700)}
    document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>render(n.dataset.view));save();render('home');
  </script>
</body>
</html>
